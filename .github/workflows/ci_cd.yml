name: Risk Intelligence Engine CI/CD

on:
  push:
    branches: [ main ]
    # Path filter: Only trigger when files critical to the API container are changed
    paths:
      - 'api/**'
      - 'configs/**'
      - 'database/**'
      - 'explainability/**'
      - 'feature_store/**'
      - 'ml/**'
      - 'models/**'
      - 'pipelines/**'
      - 'shared/**'
      - 'main.py'
      - 'requirements.txt'
      - 'docker/Dockerfile.api'
      - 'tests/unit/test_ci_smoke.py'
      - '.github/workflows/ci_cd.yml'

  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'configs/**'
      - 'database/**'
      - 'explainability/**'
      - 'feature_store/**'
      - 'ml/**'
      - 'models/**'
      - 'pipelines/**'
      - 'shared/**'
      - 'main.py'
      - 'requirements.txt'
      - 'docker/Dockerfile.api'
      - 'tests/unit/test_ci_smoke.py'
      - '.github/workflows/ci_cd.yml'

  # Allows manual execution from the GitHub Actions tab anytime
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'financial-risk-engine-dev-api' }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'financial-risk-engine-dev-cluster' }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE || 'financial-risk-engine-dev-api-service' }}

jobs:
  # STAGE 1: Continuous Integration (CI) - Automated Smoke Testing
  smoke-test:
    name: Run Automated Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fast CI Smoke Tests
        run: |
          pytest tests/unit/test_ci_smoke.py -v

  # STAGE 2: Continuous Delivery (CD) - Build & Push Docker Image to ECR
  build-and-push-ecr:
    name: Build & Push Image to AWS ECR
    runs-on: ubuntu-latest
    needs: smoke-test
    # Only build and deploy on direct push/merge to main or manual trigger
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker container for Risk Intelligence Engine API..."
          docker build -f docker/Dockerfile.api \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          echo "Pushing images to Amazon ECR ($ECR_REPOSITORY)..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # STAGE 3: Continuous Deployment (CD) - Rolling Update on AWS ECS
  deploy-ecs:
    name: Deploy Container to AWS ECS
    runs-on: ubuntu-latest
    needs: build-and-push-ecr
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Rolling ECS Service Update
        run: |
          echo "Checking if ECS Cluster '${{ env.ECS_CLUSTER }}' and Service '${{ env.ECS_SERVICE }}' are active..."
          ACTIVE_SERVICE=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query "services[?status=='ACTIVE'].serviceName" \
            --output text 2>/dev/null || true)

          if [ "$ACTIVE_SERVICE" = "${{ env.ECS_SERVICE }}" ]; then
            echo "Active ECS service detected. Triggering zero-downtime rolling deployment..."
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service ${{ env.ECS_SERVICE }} \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
            echo "Deployment signal sent successfully! ECS Fargate is now rolling out the updated container."
          else
            echo "Notice: ECS Service '${{ env.ECS_SERVICE }}' is not currently ACTIVE in cluster '${{ env.ECS_CLUSTER }}'."
            echo "The newly built Docker image was successfully packaged and pushed to Amazon (${{ env.ECR_REPOSITORY }})."
            echo "It will automatically be pulled when the ECS service is launched or scaled up."
          fi
