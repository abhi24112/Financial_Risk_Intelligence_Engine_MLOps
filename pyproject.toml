[tool.poetry]
name = "adaptive-financial-risk-intelligence-engine"
version = "0.1.0"
description = "MLOps project for transaction fraud detection"
authors = ["Abhishek <abhishekprajapati2619@gmail.com>"]
packages = [
  { include = "shared" },
  { include = "database" },
  { include = "pipelines" }
]

[tool.poetry.dependencies]
python = "^3.12"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.black]
line-length = 150

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --maxfail=2 --disable-warnings"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
