# configs/api.yaml

app:
  title: "Adaptive Financial Risk Intelligence Engine"
  description: "Real-time, low-latency financial transaction risk assessment & explainability API"
  version: "1.0.0"
  docs_url: "/docs"
  redoc_url: "/redoc"
  openapi_url: "/openapi.json"

server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1

cors:
  allow_origins:
    - "*"
  allow_credentials: true
  allow_methods:
    - "*"
  allow_headers:
    - "*"

risk_thresholds:
  low: 40
  high: 80

batch:
  max_batch_size: 500
